[project]
name = "safetygate"
version = "0.1.0"
description = "Compliance-gated pre-settlement infrastructure for autonomous AI agents on the XRP Ledger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "xrpl-py>=5.0.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
safetygate = "src.service:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
